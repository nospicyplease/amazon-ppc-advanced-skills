interface:
  display_name: "Amazon Search Term Harvest Planner"
  short_description: "Plan and preflight Rocketcart-aware search-term harvesting"
  default_prompt: >
    Use $amazon-search-term-harvest-planner to classify Amazon Ads search terms for exact-match harvesting, controlled tests, product-target expansion, bid-downs, negatives, or watchlist. Work standalone from exports or, when Rocketcart MCP is available, resolve live profile/entity IDs, check current keywords/targets/negatives, preflight destination feasibility, detect stale rows, prepare approval packets, execute only explicitly approved row IDs, read back changes, and monitor outcomes. Check relevance, order volume, ACoS/CPA, margin fit, retail readiness, duplicate risk, current negatives, source/destination routing, destination feasibility, traffic type, lifecycle stage, and strategic role. Use write-readiness statuses: PLANNING_ONLY, NEEDS_DATA, BLOCKED, APPROVAL_REQUIRED, or APPROVAL_READY. Do not recommend source negatives or live execution without evidence, approval, preflight, exact entity IDs, current/proposed values, readback, and monitoring.
