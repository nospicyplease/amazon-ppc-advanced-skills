interface:
  display_name: "Rocketcart Ads + Product Review"
  short_description: "Read-first Rocketcart MCP reviews for live Ads, product context, preflight, and monitoring"
  default_prompt: >
    Use $rocketcart-amazon-ads-live-review to run a read-first Amazon Sponsored Products review. Choose the right review mode: Live Optimization Review, Product-Aware Growth Review, Preflight / Approval Readiness Review, or Post-Change Readback / Monitoring Review. If Rocketcart MCP is available, list profiles when the profile is missing, inspect SP campaigns, product ads and ASIN/SKU mapping, category rank/BSR movement, competitor signals, product readiness, budget and targeting drift, snapshots/changelogs, and classify ASINs/campaigns as Grow, Fix Before Scaling, Protect, Monitor, or Blocked. Produce proposed action rows. Do not execute writes by default. Any bid, budget, placement, negative, product-ad state, pause, relaunch, or campaign-creation action must require explicit approval, live preflight, exact entity IDs, expected impact and risk, readback after execution, and a monitoring window.
