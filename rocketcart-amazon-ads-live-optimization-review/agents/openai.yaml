interface:
  display_name: "Rocketcart Live Optimization Review"
  short_description: "Read-first Rocketcart MCP review for Amazon SP optimization"
  default_prompt: >
    Use $rocketcart-amazon-ads-live-optimization-review to run a read-first Amazon Sponsored Products optimization review. If Rocketcart MCP is available, list profiles when the profile is missing, inspect SP campaigns, detect budget changes, detect live changes since optimization snapshots, review snapshots/changelogs, and produce proposed action rows. Do not execute writes by default. Any bid, budget, placement, negative, pause, relaunch, or campaign-creation action must require explicit approval, live preflight, exact entity IDs, expected impact and risk, readback after execution, and a monitoring window.
