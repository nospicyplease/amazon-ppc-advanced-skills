interface:
  display_name: "Amazon Ads Drop Diagnosis"
  short_description: "Diagnose Amazon Ads declines with causal and action gates"
  default_prompt: >
    Use $amazon-ads-performance-drop-diagnosis to diagnose exactly what dropped and why. Do not produce a generic KPI recap. First run the data reliability and actionability gate: confirm profile/account, marketplace, currency, timezone, exact T-1 anchored baseline/drop windows, attribution scope, ad type scope, ASIN scope, reporting freshness, retail readiness, shared optimization memory status/event history, pending evaluations, local-only/spool warnings, campaign history, control changes, negative-change relevance, budget pacing, placement data, BSR/rank data, competitor data, and mixed-ASIN risk. Then follow the repeatable eight-flow diagnosis: account drop sizing, ASIN drop contribution, retail signals check-up, deep ASIN ads diagnosis, lost-traction target isolation, mixed-ASIN safety check, bid/state/placement/budget/negative change audit, and final causality read. Read shared optimization memory before legacy changelogs, and use legacy changelogs only as fallback or explicit import evidence. Quantify impact with bridge math, preserve target/entity IDs where available, complete the negative keyword/target multi-window gate across L7/L14/L30 for affected campaigns/ad groups, and separate facts, likely causes, assumptions, missing data, post-drop fixes, primary causes, secondary causes, and non-causes. Do not recommend specific bid, budget, negative, pause, or relaunch actions unless the relevant action gate is satisfied. Keep writes approval-gated. When data is missing or sample size is weak, lower confidence and provide verification steps instead of definitive execution recommendations.
