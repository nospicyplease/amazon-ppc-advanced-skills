interface:
  display_name: "Amazon Ads Drop Diagnosis"
  short_description: "Diagnose Amazon Ads declines with causal and action gates"
  default_prompt: >
    Use $amazon-ads-performance-drop-diagnosis to diagnose why this Amazon Ads performance drop happened and what to do next. Do not produce a generic KPI recap. First run the data reliability and actionability gate: confirm date ranges, attribution scope, ad type scope, ASIN scope, marketplace, currency, reporting freshness, retail readiness, campaign history, control changes, negative-change relevance, budget pacing, placement data, BSR/rank data, competitor data, and mixed-ASIN risk. Identify the breakpoint, quantify impact with bridge math, rank the biggest losing entities by business impact, and separate facts, likely causes, assumptions, missing data, and post-drop fixes. Do not recommend specific bid, budget, negative, pause, or relaunch actions unless the relevant action gate is satisfied. When data is missing or sample size is weak, lower confidence and provide verification steps instead of definitive execution recommendations.
